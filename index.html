<style>
:root{--bg:#101116;--card:#191a22;--card2:#22232d;--line:#30313d;--txt:#f5f5f8;--muted:#a1a3b4;--yellow:#f5d547;--lilac:#b8a7ff;--green:#52d69a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit;cursor:pointer}.app{max-width:1080px;margin:auto;padding:18px 15px 90px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.mark{width:42px;height:42px;border-radius:13px;background:var(--yellow);color:#171717;display:grid;place-items:center;font-weight:950}.brandname{font-weight:850}.sub{font-size:10px;letter-spacing:1.3px;color:var(--muted);text-transform:uppercase;margin-top:3px}.live{font-size:12px;color:var(--green);font-weight:800}.live:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:7px}
button{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:11px;padding:9px 12px}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin:27px 0 18px}.eyebrow{color:var(--yellow);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;margin-bottom:7px}h1{font-size:clamp(28px,5vw,40px);line-height:1.08;letter-spacing:-1px;margin:0}.hero p{color:var(--muted);font-size:13px;margin:9px 0 0}.switch{display:flex;gap:5px;background:var(--card);padding:5px;border:1px solid var(--line);border-radius:14px}.switch button{border:0;background:transparent;color:var(--muted);font-weight:800}.switch button.active{background:var(--yellow);color:#171717}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:9px;margin:20px 0 12px}.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--txt);outline:none}.search:focus{border-color:var(--lilac)}
.strip,.filters{display:flex;gap:7px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:thin}.date,.filter{white-space:nowrap;font-size:12px;font-weight:750;color:var(--muted)}.date.active{border-color:var(--yellow);color:var(--yellow);background:#f5d54712}.filter.active{border-color:var(--lilac);color:var(--lilac);background:#b8a7ff12}
.notice{display:none;margin:10px 0;padding:11px;border:1px solid #8b7530;background:#f5d54712;color:#eadb92;border-radius:11px;font-size:12px}.heading{display:flex;justify-content:space-between;align-items:center;margin:14px 0 10px;font-size:14px;font-weight:850}.count{color:var(--muted);font-size:12px;font-weight:500}.groups{display:flex;flex-direction:column;gap:12px}.league{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}.league-title{display:flex;align-items:center;gap:9px;padding:13px;background:#1d1e26;font-size:12px;font-weight:850}.league-title .star{color:var(--yellow)}.league-title .n{margin-left:auto;color:var(--muted)}.match{display:grid;grid-template-columns:65px minmax(0,1fr) 48px;gap:9px;align-items:center;padding:13px 11px;border-top:1px solid #2a2b35}.time{text-align:center;color:var(--muted);font-size:11px}.time.live{color:var(--green);font-weight:850}.teams{display:flex;flex-direction:column;gap:8px;min-width:0}.team{display:flex;align-items:center;gap:8px;min-width:0}.logo,.fallback{width:24px;height:24px;flex:0 0 24px;object-fit:contain}.fallback{display:grid;place-items:center;border-radius:50%;background:#2d2e39;color:#ddd;font-size:9px;font-weight:850}.teamname{font-size:12px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.scores{display:flex;flex-direction:column;gap:8px;text-align:right;font-weight:900;font-size:14px}.matchaction{text-align:right;margin-top:8px}.details{padding:6px 8px;font-size:10px;color:var(--lilac);border-color:#454354;background:#24232f}.empty,.loading,.error{padding:30px 16px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:13px;line-height:1.6}.error{color:#ffb0b6}
nav{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#101116ee;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}.navinner{max-width:520px;margin:auto;display:flex;justify-content:space-around}.navitem{font-size:10px;color:var(--muted);text-align:center}.navitem b{display:block;font-size:18px;margin-bottom:3px}.navitem.active{color:var(--yellow)}
.backdrop{display:none;position:fixed;inset:0;z-index:20;background:#050509d9;align-items:flex-end;justify-content:center}.backdrop.open{display:flex}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:#171820;border:1px solid #343542;border-radius:22px 22px 0 0;padding:16px 14px calc(22px + env(safe-area-inset-bottom))}.modalhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;font-size:14px;font-weight:850}.close{font-size:22px;width:36px;height:36px;padding:0}.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:17px 10px;background:var(--card2);border:1px solid var(--line);border-radius:15px}.scoreteam{text-align:center;display:flex;flex-direction:column;align-items:center;gap:9px;min-width:0}.scoreteam .logo,.scoreteam .fallback{width:44px;height:44px;font-size:13px}.scoreteamname{font-size:12px;font-weight:800;overflow-wrap:anywhere}.bigscore{font-size:26px;font-weight:950}.scorestatus{font-size:11px;color:var(--muted);text-align:center;margin-top:5px}.tabs{display:flex;gap:7px;overflow:auto;margin:14px 0 12px}.tab{white-space:nowrap;font-size:12px;font-weight:800;color:var(--muted);background:var(--card2)}.tab.active{border-color:var(--yellow);color:var(--yellow);background:#f5d54712}.panel{min-height:100px}.detailrow{display:flex;justify-content:space-between;gap:12px;padding:11px;background:var(--card2);border:1px solid #2d2e38;border-radius:10px;font-size:12px;margin-bottom:7px}.detailrow strong{color:#eee}.muted{color:var(--muted);font-size:12px;line-height:1.6}.table{width:100%;border-collapse:collapse;font-size:12px}.table td,.table th{padding:10px 6px;border-bottom:1px solid #2c2d37;text-align:center}.table td:first-child,.table th:first-child{text-align:left}.table th{color:var(--muted)}.formations{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formationcard{padding:12px;background:var(--card2);border:1px solid var(--line);border-radius:12px}.formationcard h3{font-size:12px;margin:0 0 8px}.formation{color:var(--green);font-size:12px;margin-bottom:8px}.player{font-size:11px;padding:4px 0;color:#ddd}.player em{font-style:normal;color:var(--yellow);margin-right:7px}.event{display:grid;grid-template-columns:45px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid #2c2d37;font-size:12px}.eventtime{color:var(--yellow);font-weight:850}
@media(min-width:650px){.app{padding-top:25px}.backdrop{align-items:center;padding:20px}.modal{border-radius:22px;margin:20px}.match{grid-template-columns:78px minmax(0,1fr) 60px;padding:16px}}
@media(max-width:480px){.hero{align-items:flex-start;flex-direction:column}.switch{width:100%}.switch button{flex:1}.toolbar{grid-template-columns:1fr}.match{grid-template-columns:52px minmax(0,1fr) 38px;gap:6px;padding:12px 8px}.teamname{font-size:11px}.details{padding:5px 6px}.formations{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><div class="mark">OC</div><div><div class="brandname">OutcomeChad Sports</div><div class="sub">Live scores & match centre</div></div></div><div class="live">LIVE</div></header>
<section class="hero"><div><div class="eyebrow">The game is on</div><h1>Every match.<br>Every moment.</h1><p>Live scores, fixtures, results and match details.</p></div><div class="switch"><button class="active" data-sport="football">⚽ Football</button><button data-sport="basketball">🏀 Basketball</button></div></section>
<div class="toolbar"><input class="search" id="search" placeholder="Search teams or competitions…" type="search"><button id="refresh">↻ Refresh</button></div>
<div class="strip" id="dates"></div><div class="filters" id="statuses"><button class="filter active" data-status="all">All matches</button><button class="filter" data-status="live">Live</button><button class="filter" data-status="scheduled">Upcoming</button><button class="filter" data-status="finished">Finished</button></div>
<div class="filters" id="leagues"></div><div class="notice" id="notice"></div>
<div class="heading"><span id="heading">Football matches</span><span class="count" id="count">—</span></div><main id="list"><div class="loading">Loading matches…</div></main>
</div>
<nav><div class="navinner"><div class="navitem active"><b>◉</b>Scores</div><div class="navitem"><b>▦</b>Fixtures</div><div class="navitem"><b>☆</b>Favorites</div><div class="navitem"><b>☰</b>More</div></div></nav>
<div class="backdrop" id="backdrop" role="dialog" aria-modal="true" aria-label="Match centre"><section class="modal"><div class="modalhead"><span id="modalTitle">Match Centre</span><button class="close" id="close" aria-label="Close">×</button></div><div id="scoreboard"></div><div class="tabs" id="tabs"></div><div class="panel" id="panel"></div></section></div>
<script>
"use strict";
const API = {
  footballLive: "/api/football/live",
  footballFixtures: "/api/football/fixtures",
  basketball: "/api/basketball/live"
};
const S={sport:"football",status:"all",date:new Date(),matches:[],league:"all",search:"",selected:null,tab:"overview",logos:new Map()};
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pick=(...v)=>v.find(x=>x!==undefined&&x!==null&&x!=="");
const arr=v=>Array.isArray(v)?v:(v&&typeof v==="object"?Object.values(v):[]);
const key=d=>{d=new Date(d);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const same=(a,b)=>key(a)===key(b);
function dateVal(v){if(!v)return null;if(typeof v==="number")return new Date(v<1e12?v*1000:v);let s=String(v);if(/^\d{10}$/.test(s))return new Date(+s*1000);if(/^\d{13}$/.test(s))return new Date(+s);let d=new Date(s);return isNaN(d)?null:d}
function time(v){let d=dateVal(v);return d?d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):(v||"—")}
function initials(n){return String(n||"?").trim().split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase()}
function rows(p){if(Array.isArray(p))return p;if(!p||typeof p!=="object")return[];for(const k of ["data","results","matches","matchList","list","items","response"]){if(Array.isArray(p[k]))return p[k];if(p[k]&&typeof p[k]==="object"){let r=rows(p[k]);if(r.length)return r}}return[]}
function normalize(r, i = 0) {
  const h = pick(r.home, r.homeTeam, r.home_team, r.teamHome, r.host, {});
  const a = pick(r.away, r.awayTeam, r.away_team, r.teamAway, r.guest, {});

  const hn = pick(
    r.homeName, r.home_team_name, r.homeTeamName,
    r.hostName, h.name, h.teamName, r.home, "Home"
  );

  const an = pick(
    r.awayName, r.away_team_name, r.awayTeamName,
    r.guestName, a.name, a.teamName, r.away, "Away"
  );

  const rawStatus = pick(
    r.status,
    r.matchStatus,
    r.match_status,
    r.state,
    r.statusName,
    r.status_name,
    ""
  );

  const statusText = String(rawStatus).toLowerCase();

  let status = "scheduled";

  // iSports uses -1 for completed matches in the fixtures response.
  if (Number(rawStatus) === -1) {
    status = "finished";
  } else if (
    /finish|ended|full.?time|\bft\b|完场|结束/.test(statusText) ||
    r.isFinished === true
  ) {
    status = "finished";
  } else if (
    /live|in.?play|playing|quarter|half|period|进行/.test(statusText) ||
    r.isLive === true
  ) {
    status = "live";
  } else if (/cancel|postpon|abandon|suspend/.test(statusText)) {
    status = "other";
  }

  const comp = pick(
    r.competitionName,
    r.leagueName,
    r.league_name,
    r.competition,
    r.league,
    r.tournamentName,
    "Matches"
  );

  return {
    id: String(pick(r.matchId, r.match_id, r.id, r.fixtureId, r.fixture_id, i)),
    raw: r,

    home: String(typeof hn === "object"
      ? pick(hn.name, hn.teamName, "Home")
      : hn),

    away: String(typeof an === "object"
      ? pick(an.name, an.teamName, "Away")
      : an),

    homeId: pick(r.homeTeamId, r.home_team_id, r.homeId, h.id, h.teamId),
    awayId: pick(r.awayTeamId, r.away_team_id, r.awayId, a.id, a.teamId),

    homeLogo: pick(r.homeLogo, r.home_logo, r.homeTeamLogo, h.logo, h.logoUrl),
    awayLogo: pick(r.awayLogo, r.away_logo, r.awayTeamLogo, a.logo, a.logoUrl),

    hs: pick(r.homeScore, r.home_score, r.homeGoals, r.scoreHome, r.homePoints, h.score),
    as: pick(r.awayScore, r.away_score, r.awayGoals, r.scoreAway, r.awayPoints, a.score),

    status,
    statusText: status === "live"
      ? "LIVE"
      : status === "finished"
        ? "FT"
        : String(rawStatus || ""),

    date: pick(
      r.matchTime,
      r.match_time,
      r.startTime,
      r.start_time,
      r.date,
      r.kickoff,
      r.time,
      r.timestamp
    ),

    competition: String(typeof comp === "object"
      ? pick(comp.name, comp.title, "Matches")
      : comp),

    venue: pick(r.venue, r.stadium, r.arena),
    round: pick(r.round, r.stage, r.matchRound),

    homePeriods: pick(
      r.homePeriodScores,
      r.home_period_scores,
      r.homeQuarterScores,
      r.home_quarter_scores,
      r.homeHalfScore
    ),

    awayPeriods: pick(
      r.awayPeriodScores,
      r.away_period_scores,
      r.awayQuarterScores,
      r.away_quarter_scores,
      r.awayHalfScore
    )
  };
}
function logo(name,url,id){url=url||(id?S.logos.get(String(id)):null);return url?`<img class="logo" src="${esc(url)}" alt="" loading="lazy" onerror="this.outerHTML='<span class=&quot;fallback&quot;>${esc(initials(name))}</span>'">`:`<span class="fallback">${esc(initials(name))}</span>`}
async function getLogos(){try{let r=await fetch("/api/teams",{cache:"no-store"});if(!r.ok)return;for(let t of rows(await r.json())){let id=pick(t.teamID,t.teamId,t.id,t.team_id),u=pick(t.logo,t.logoUrl,t.teamLogo,t.image);if(id&&u)S.logos.set(String(id),u)}}catch(e){}}
function statusLabel(m){if(m.status==="live")return m.statusText||"LIVE";if(m.status==="finished")return"FT";return time(m.date)}
async function load() {
  if (!S.matches.length) {
    $("#list").innerHTML =
      '<div class="loading">Loading matches…</div>';
  }

  $("#notice").style.display = "none";

  try {
    const selectedDate = key(S.date);

    // Basketball continues using its existing endpoint.
    if (S.sport === "basketball") {
      const url = new URL(API.basketball, location.origin);
      url.searchParams.set("date", selectedDate);

      const response = await fetch(url, { cache: "no-store" });

      if (!response.ok) {
        throw new Error("Basketball API returned " + response.status);
      }

      const payload = await response.json();

      S.matches = rows(payload)
        .map(normalize)
        .filter(m => m.home && m.away);

      if ((payload.message || payload.error) && !S.matches.length) {
        notice(payload.message || payload.error);
      }

      render();
      return;
    }

    // Football: fetch the fixtures for the selected calendar date.
    const fixturesUrl = new URL(
      API.footballFixtures,
      location.origin
    );

    fixturesUrl.searchParams.set("date", selectedDate);

    const fixturesResponse = await fetch(fixturesUrl, {
      cache: "no-store"
    });

    if (!fixturesResponse.ok) {
      throw new Error(
        "Football fixtures API returned " + fixturesResponse.status
      );
    }

    const fixturesPayload = await fixturesResponse.json();

    let fixtureRows = rows(fixturesPayload);

    let matches = fixtureRows
      .map(normalize)
      .filter(m => m.home && m.away);

    // Only request live scores when the selected date is today.
    if (same(S.date, new Date())) {
      try {
        const liveUrl = new URL(
          API.footballLive,
          location.origin
        );

        liveUrl.searchParams.set("date", selectedDate);

        const liveResponse = await fetch(liveUrl, {
          cache: "no-store"
        });

        if (liveResponse.ok) {
          const livePayload = await liveResponse.json();
          const liveRows = rows(livePayload).map(normalize);

          // Match live updates to fixtures using the match ID.
          const liveMap = new Map(
            liveRows.map(match => [String(match.id), match])
          );

          matches = matches.map(fixture => {
            const live = liveMap.get(String(fixture.id));

            if (!live) return fixture;

            return {
              ...fixture,
              hs: live.hs ?? fixture.hs,
              as: live.as ?? fixture.as,
              status: live.status === "live"
                ? "live"
                : live.status === "finished"
                  ? "finished"
                  : fixture.status,
              statusText: live.statusText || fixture.statusText,
              raw: {
                ...fixture.raw,
                ...live.raw
              }
            };
          });

          // Add live matches that were missing from the fixtures response.
          const fixtureIds = new Set(
            matches.map(match => String(match.id))
          );

          for (const live of liveRows) {
            if (!fixtureIds.has(String(live.id))) {
              matches.push(live);
            }
          }
        }
      } catch (liveError) {
        // Fixtures can still be displayed if the live endpoint fails.
        console.warn("Could not refresh live football scores:", liveError);
      }
    }

    S.matches = matches;

    if (
      (fixturesPayload.message || fixturesPayload.error) &&
      !S.matches.length
    ) {
      notice(
        fixturesPayload.message ||
        fixturesPayload.error
      );
    }

    render();

  } catch (error) {
    console.error("Match loading error:", error);

    S.matches = [];

    $("#list").innerHTML = `
      <div class="error">
        Could not load matches.<br>
        <small>${esc(error.message)}. Check your API route.</small>
      </div>
    `;

    $("#count").textContent = "0 matches";
  }
}
function notice(t){$("#notice").textContent=t;$("#notice").style.display="block"}
function filtered(){return S.matches.filter(m=>(S.status==="all"||m.status===S.status)&&(S.league==="all"||m.competition===S.league)&&(`${m.home} ${m.away} ${m.competition}`.toLowerCase().includes(S.search.toLowerCase().trim())))}
function render(){
 let names=[...new Set(S.matches.map(m=>m.competition))].sort();if(S.league!=="all"&&!names.includes(S.league))S.league="all";
 $("#leagues").innerHTML=[`<button class="filter ${S.league==="all"?"active":""}" data-league="all">All competitions</button>`,...names.map(n=>`<button class="filter ${S.league===n?"active":""}" data-league="${esc(n)}">${esc(n)}</button>`)].join("");
 let list=filtered();$("#count").textContent=`${list.length} ${list.length===1?"match":"matches"}`;$("#heading").textContent=(S.sport==="football"?"Football":"Basketball")+" matches";
 if(!list.length){$("#list").innerHTML='<div class="empty">No matches found for these filters.<br>Try another date, status or competition.</div>';return}
 let groups=new Map();list.forEach(m=>{if(!groups.has(m.competition))groups.set(m.competition,[]);groups.get(m.competition).push(m)});
 $("#list").innerHTML=`<div class="groups">${[...groups].map(([league,ms])=>`<section class="league"><div class="league-title"><span class="star">★</span>${esc(league)}<span class="n">${ms.length}</span></div>${ms.map(m=>`<article class="match"><div class="time ${m.status==="live"?"live":""}">${esc(statusLabel(m))}</div><div class="teams"><div class="team">${logo(m.home,m.homeLogo,m.homeId)}<span class="teamname">${esc(m.home)}</span></div><div class="team">${logo(m.away,m.awayLogo,m.awayId)}<span class="teamname">${esc(m.away)}</span></div><div class="matchaction"><button class="details" data-id="${esc(m.id)}">Match centre ↗</button></div></div><div class="scores"><span>${esc(m.hs??"–")}</span><span>${esc(m.as??"–")}</span></div></article>`).join("")}</section>`).join("")}</div>`;
 $("#list").querySelectorAll("[data-id]").forEach(b=>b.addEventListener("click",()=>{let m=S.matches.find(x=>x.id===b.dataset.id);if(m)openCentre(m)}))
}
function drawDates(){let now=new Date(),ds=Array.from({length:7},(_,i)=>{let d=new Date(now);d.setDate(now.getDate()+i-2);return d});$("#dates").innerHTML=ds.map(d=>`<button class="date ${same(d,S.date)?"active":""}" data-date="${key(d)}">${same(d,now)?"Today":same(d,new Date(now.getTime()+86400000))?"Tomorrow":d.toLocaleDateString([],{weekday:"short",month:"short",day:"numeric"})}</button>`).join("");$("#dates").querySelectorAll("[data-date]").forEach(b=>b.onclick=()=>{S.date=new Date(b.dataset.date+"T12:00:00");drawDates();load()})}
function openCentre(m){S.selected=m;S.tab="overview";$("#modalTitle").textContent=m.competition+" · Match Centre";$("#scoreboard").innerHTML=scoreboard(m);drawTabs();drawPanel();$("#backdrop").classList.add("open");document.body.style.overflow="hidden"}
function scoreboard(m){return `<div class="scoreboard"><div class="scoreteam">${logo(m.home,m.homeLogo,m.homeId)}<div class="scoreteamname">${esc(m.home)}</div></div><div><div class="bigscore">${esc(m.hs??"–")} : ${esc(m.as??"–")}</div><div class="scorestatus">${esc(statusLabel(m))}</div></div><div class="scoreteam">${logo(m.away,m.awayLogo,m.awayId)}<div class="scoreteamname">${esc(m.away)}</div></div></div>`}
function drawTabs(){let ts=S.sport==="football"?[["overview","Overview"],["stats","Stats"],["lineups","Lineups"],["events","Events"]]:[["overview","Overview"],["stats","Stats"],["periods","Periods"],["players","Players"]];$("#tabs").innerHTML=ts.map(([id,label])=>`<button class="tab ${S.tab===id?"active":""}" data-tab="${id}">${label}</button>`).join("");$("#tabs").querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;drawTabs();drawPanel()})}
function detailRows(rows){return `<div>${rows.map(([a,b])=>`<div class="detailrow"><span>${esc(a)}</span><strong>${esc(b??"Not provided")}</strong></div>`).join("")}</div>`}
function toArray(v){if(Array.isArray(v))return v;if(v&&typeof v==="object")return Object.entries(v).map(([k,x])=>typeof x==="object"?{label:k,...x}:{label:k,value:x});if(typeof v==="string")return v.split(/[,;|]/).map(x=>x.trim()).filter(Boolean);return[]}
function statsRows(v){return toArray(v).map(x=>({label:pick(x.name,x.label,x.type,x.statName,x.key,"Statistic"),home:pick(x.home,x.homeValue,x.home_score,x.valueHome,x.value,"—"),away:pick(x.away,x.awayValue,x.away_score,x.valueAway,"—")}))}
function panelEmpty(t){return `<div class="empty">${esc(t)}</div>`}
function drawPanel(){let m=S.selected;if(!m)return;let r=m.raw||{},d=pick(r.details,r.detail,r.statistics,r.stats,r.lineups,r.events,r)||{};
 if(S.tab==="overview"){$("#panel").innerHTML=detailRows([["Competition",m.competition],["Date",m.date&&dateVal(m.date)?dateVal(m.date).toLocaleDateString():"Not provided"],["Start time",time(m.date)],["Venue",m.venue],["Round",m.round],["Match ID",m.id]]);return}
 if(S.tab==="periods"){let h=toArray(m.homePeriods),a=toArray(m.awayPeriods);if(!h.length&&!a.length){$("#panel").innerHTML=panelEmpty("Period or quarter scores are not included in the current match response.");return}let n=Math.max(h.length,a.length);$("#panel").innerHTML=`<table class="table"><thead><tr><th>Team</th>${Array.from({length:n},(_,i)=>`<th>${S.sport==="basketball"?"Q":"P"}${i+1}</th>`).join("")}<th>Total</th></tr></thead><tbody><tr><td>${esc(m.home)}</td>${Array.from({length:n},(_,i)=>`<td>${esc(h[i]??"—")}</td>`).join("")}<td>${esc(m.hs??"—")}</td></tr><tr><td>${esc(m.away)}</td>${Array.from({length:n},(_,i)=>`<td>${esc(a[i]??"—")}</td>`).join("")}<td>${esc(m.as??"—")}</td></tr></tbody></table>`;return}
 if(S.tab==="stats"){let rs=statsRows(pick(d.stats,d.statistics,d.matchStats,d.match_statistics,r.stats,r.statistics));$("#panel").innerHTML=rs.length?`<table class="table"><thead><tr><th>${esc(m.home)}</th><th>Statistic</th><th>${esc(m.away)}</th></tr></thead><tbody>${rs.map(x=>`<tr><td>${esc(x.home)}</td><td>${esc(x.label)}</td><td>${esc(x.away)}</td></tr>`).join("")}</tbody></table>`:panelEmpty("Statistics are not in the current live response. Your API must supply match statistics for this fixture.");return}
 if(S.tab==="lineups"){let l=pick(d.lineups,d.lineup,r.lineups,r.lineup);if(!l){ $("#panel").innerHTML=panelEmpty("Lineups and formations are not included in the current response.");return}if(Array.isArray(l))l={homeLineup:l[0],awayLineup:l[1]};let h=pick(l.homeLineup,l.home_lineup,l.home,l.homePlayers,[]),a=pick(l.awayLineup,l.away_lineup,l.away,l.awayPlayers,[]);let players=v=>toArray(v).map(p=>typeof p==="object"?`<div class="player"><em>${esc(pick(p.number,p.shirtNumber,p.jerseyNumber,"·"))}</em>${esc(pick(p.name,p.playerName,p.player,"Player"))}${pick(p.position,p.pos)?` · ${esc(pick(p.position,p.pos))}`:""}</div>`:`<div class="player">${esc(p)}</div>`).join("");$("#panel").innerHTML=`<div class="formations"><div class="formationcard"><h3>${esc(m.home)}</h3><div class="formation">${esc(pick(l.homeFormation,l.home_formation,"Formation unavailable"))}</div>${players(h)||'<span class="muted">Lineup unavailable</span>'}</div><div class="formationcard"><h3>${esc(m.away)}</h3><div class="formation">${esc(pick(l.awayFormation,l.away_formation,"Formation unavailable"))}</div>${players(a)||'<span class="muted">Lineup unavailable</span>'}</div></div>`;return}
 if(S.tab==="events"){let ev=toArray(pick(d.events,d.incidents,r.events,r.incidents));$("#panel").innerHTML=ev.length?ev.map(e=>`<div class="event"><div class="eventtime">${esc(pick(e.time,e.minute,e.eventTime,"—"))}${pick(e.time,e.minute)?"'":""}</div><div>${esc(pick(e.description,e.eventName,e.type,e.name,"Match event"))}${pick(e.player,e.playerName)?` · ${esc(pick(e.player,e.playerName))}`:""}</div></div>`).join(""):panelEmpty("Match events are not included in the current response.");return}
 if(S.tab==="players"){let ps=toArray(pick(d.players,d.playerStats,d.player_stats,r.players));$("#panel").innerHTML=ps.length?ps.map(p=>`<div class="detailrow"><span>${esc(pick(p.playerName,p.name,p.player,"Player"))}</span><strong>${esc(pick(p.points,p.score,p.stat,"—"))}</strong></div>`).join(""):panelEmpty("Player stats are not included in the current response.")}
}
function closeCentre(){$("#backdrop").classList.remove("open");document.body.style.overflow="";S.selected=null}
document.querySelectorAll("[data-sport]").forEach(b=>b.onclick=()=>{if(S.sport===b.dataset.sport)return;S.sport=b.dataset.sport;S.status="all";S.league="all";document.querySelectorAll("[data-sport]").forEach(x=>x.classList.toggle("active",x===b));document.querySelectorAll("[data-status]").forEach(x=>x.classList.toggle("active",x.dataset.status==="all"));load()});
document.querySelectorAll("[data-status]").forEach(b=>b.onclick=()=>{S.status=b.dataset.status;document.querySelectorAll("[data-status]").forEach(x=>x.classList.toggle("active",x===b));render()});
$("#leagues").addEventListener("click",e=>{let b=e.target.closest("[data-league]");if(!b)return;S.league=b.dataset.league;render()});
$("#search").addEventListener("input",e=>{S.search=e.target.value;render()});$("#refresh").onclick=load;$("#close").onclick=closeCentre;$("#backdrop").onclick=e=>{if(e.target===$("#backdrop"))closeCentre()};document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCentre()});
drawDates();getLogos().finally(load);setInterval(load,60000);
</script>
</body></html>

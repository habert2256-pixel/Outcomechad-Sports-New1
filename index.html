<style>
:root {
  --bg: #101116;
  --card: #191a22;

* {

}

body {

button,

button {

.app {

/* Header */

header {

.brand {

.mark {

<script>
"use strict";

/* =========================================
   API CONFIGURATION
========================================= */

const API = {
  footballLive: "/api/football/live",
  footballFixtures: "/api/football/fixtures"
};

const S = {
  status: "all",
  date: new Date(),
  matches: [],
  league: "all",
  search: "",
  selected: null,
  tab: "overview"
};

const $ = selector => document.querySelector(selector);


/* =========================================
   HELPERS
========================================= */

const esc = value =>
  String(value ?? "").replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[character]));

const pick = (...values) =>
  values.find(value =>
    value !== undefined &&
    value !== null &&
    value !== ""
  );

function rows(payload) {
  if (Array.isArray(payload)) {
    return payload;
  }

  if (!payload || typeof payload !== "object") {
    return [];
  }

  for (const key of [
    "data",
    "results",
    "matches",
    "matchList",
    "list",
    "items",
    "response"
  ]) {
    if (Array.isArray(payload[key])) {
      return payload[key];
    }

    if (
      payload[key] &&
      typeof payload[key] === "object"
    ) {
      const nested = rows(payload[key]);

      if (nested.length) {
        return nested;
      }
    }
  }

  return [];
}

function dateKey(date) {
  const d = new Date(date);

  return (
    d.getFullYear() +
    "-" +
    String(d.getMonth() + 1).padStart(2, "0") +
    "-" +
    String(d.getDate()).padStart(2, "0")
  );
}

function sameDate(first, second) {
  return dateKey(first) === dateKey(second);
}

function dateValue(value) {
  if (!value) return null;

  if (typeof value === "number") {
    return new Date(
      value < 1e12 ? value * 1000 : value
    );
  }

  const stringValue = String(value);

  if (/^\d{10}$/.test(stringValue)) {
    return new Date(Number(stringValue) * 1000);
  }

  if (/^\d{13}$/.test(stringValue)) {
    return new Date(Number(stringValue));
  }

  const parsed = new Date(stringValue);

  return Number.isNaN(parsed.getTime())
    ? null
    : parsed;
}

function formatTime(value) {
  const date = dateValue(value);

  return date
    ? date.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      })
    : "—";
}

function initials(name) {
  return String(name || "?")
    .trim()
    .split(/\s+/)
    .slice(0, 2)
    .map(part => part[0] || "")
    .join("")
    .toUpperCase();
}

function showNotice(message) {
  const notice = $("#notice");

  notice.textContent = message;
  notice.style.display = "block";
}

function hideNotice() {
  $("#notice").style.display = "none";
}


/* =========================================
   FOOTBALL RESPONSE NORMALIZATION
========================================= */

function normalize(match, index = 0) {
  const home = pick(
    match.home,
    match.homeTeam,
    match.home_team,
    match.teamHome,
    match.host,
    {}
  );

  const away = pick(
    match.away,
    match.awayTeam,
    match.away_team,
    match.teamAway,
    match.guest,
    {}
  );

  const homeName = pick(
    match.homeName,
    match.home_team_name,
    match.homeTeamName,
    match.hostName,
    home.name,
    home.teamName,
    "Home"
  );

  const awayName = pick(
    match.awayName,
    match.away_team_name,
    match.awayTeamName,
    match.guestName,
    away.name,
    away.teamName,
    "Away"
  );

  const rawStatus = pick(
    match.status,
    match.matchStatus,
    match.match_status,
    match.state,
    match.statusName,
    match.status_name,
    ""
  );

  const statusText = String(rawStatus).toLowerCase();

  let status = "scheduled";

  if (
    rawStatus === "finished" ||
    /finish|ended|full.?time|\bft\b|after.?extra.?time|after.?penalties/.test(statusText)
  ) {
    status = "finished";
  } else if (
    rawStatus === "live" ||
    /live|in.?play|playing|half.?time|1st half|2nd half|extra.?time|penalt/.test(statusText)
  ) {
    status = "live";
  } else if (
    /cancel|postpon|abandon|suspend/.test(statusText)
  ) {
    status = "other";
  }

  const competition = pick(
    match.competitionName,
    match.leagueName,
    match.league_name,
    match.competition,
    match.league,
    match.tournamentName,
    "Football"
  );

  return {
    id: String(
      pick(
        match.matchId,
        match.match_id,
        match.id,
        match.fixtureId,
        match.fixture_id,
        index
      )
    ),

    raw: match,

    home: String(
      typeof homeName === "object"
        ? pick(homeName.name, homeName.teamName, "Home")
        : homeName
    ),

    away: String(
      typeof awayName === "object"
        ? pick(awayName.name, awayName.teamName, "Away")
        : awayName
    ),

    homeId: pick(
      match.homeTeamId,
      match.home_team_id,
      match.homeId,
      home.id,
      home.teamId
    ),

    awayId: pick(
      match.awayTeamId,
      match.away_team_id,
      match.awayId,
      away.id,
      away.teamId
    ),

    homeLogo: pick(
      match.homeLogo,
      match.home_logo,
      match.homeTeamLogo,
      home.logo,
      home.logoUrl,
      home.image_path
    ),

    awayLogo: pick(
      match.awayLogo,
      match.away_logo,
      match.awayTeamLogo,
      away.logo,
      away.logoUrl,
      away.image_path
    ),

    hs: pick(
      match.homeScore,
      match.home_score,
      match.homeGoals,
      match.scoreHome
    ),

    as: pick(
      match.awayScore,
      match.away_score,
      match.awayGoals,
      match.scoreAway
    ),

    status,

    statusText:
      status === "live"
        ? "LIVE"
        : status === "finished"
          ? "FT"
          : String(rawStatus || ""),

    date: pick(
      match.matchTime,
      match.match_time,
      match.startTime,
      match.start_time,
      match.date,
      match.kickoff,
      match.time,
      match.timestamp
    ),

    competition: String(
      typeof competition === "object"
        ? pick(competition.name, competition.title, "Football")
        : competition
    ),

    venue: pick(
      match.venue,
      match.stadium
    ),

    round: pick(
      match.round,
      match.stage,
      match.matchRound
    )
  };
}


/* =========================================
   TEAM LOGOS
========================================= */

function logo(name, url) {
  if (url) {
    return `
      <img
        class="logo"
        src="${esc(url)}"
        alt=""
        loading="lazy"
        onerror="this.outerHTML='<span class=&quot;fallback&quot;>${esc(initials(name))}</span>'"
      >
    `;
  }

  return `
    <span class="fallback">
      ${esc(initials(name))}
    </span>
  `;
}


/* =========================================
   LOAD FOOTBALL MATCHES
========================================= */

async function load() {
  if (!S.matches.length) {
    $("#list").innerHTML = `
      <div class="loading">
        Loading football matches…
      </div>
    `;
  }

  hideNotice();

  try {
    const selectedDate = dateKey(S.date);

    const fixturesUrl = new URL(
      API.footballFixtures,
      location.origin
    );

    fixturesUrl.searchParams.set(
      "date",
      selectedDate
    );

    const fixturesResponse = await fetch(
      fixturesUrl,
      { cache: "no-store" }
    );

    if (!fixturesResponse.ok) {
      throw new Error(
        "Football fixtures API returned " +
        fixturesResponse.status
      );
    }

    const fixturesPayload =
      await fixturesResponse.json();

    let matches = rows(fixturesPayload)
      .map(normalize)
      .filter(match => match.home && match.away);

    /*
      Load live scores for today's matches.
    */

    if (sameDate(S.date, new Date())) {
      try {
        const liveUrl = new URL(
          API.footballLive,
          location.origin
        );

        const liveResponse = await fetch(
          liveUrl,
          { cache: "no-store" }
        );

        if (liveResponse.ok) {
          const livePayload =
            await liveResponse.json();

          const liveMatches = rows(livePayload)
            .map(normalize)
            .filter(match => match.home && match.away);

          const liveMap = new Map(
            liveMatches.map(match => [
              String(match.id),
              match
            ])
          );

          /*
            Update fixture records with live data.
          */

          matches = matches.map(fixture => {
            const live = liveMap.get(
              String(fixture.id)
            );

            if (!live) return fixture;

            return {
              ...fixture,

              hs: live.hs ?? fixture.hs,
              as: live.as ?? fixture.as,

              status:
                live.status === "live"
                  ? "live"
                  : live.status === "finished"
                    ? "finished"
                    : fixture.status,

              statusText:
                live.statusText ||
                fixture.statusText,

              raw: {
                ...fixture.raw,
                ...live.raw
              }
            };
          });

          /*
            Add live matches missing from fixtures.
          */

          const fixtureIds = new Set(
            matches.map(match => String(match.id))
          );

          for (const live of liveMatches) {
            if (!fixtureIds.has(String(live.id))) {
              matches.push(live);
            }
          }
        }

      } catch (liveError) {
        console.warn(
          "Could not refresh live football scores:",
          liveError
        );
      }
    }

    S.matches = matches;

    if (
      (fixturesPayload.message ||
       fixturesPayload.error) &&
      !S.matches.length
    ) {
      showNotice(
        fixturesPayload.message ||
        fixturesPayload.error
      );
    }

    render();

  } catch (error) {
    console.error(
      "Football match loading error:",
      error
    );

    S.matches = [];

    $("#list").innerHTML = `
      <div class="error">

        Could not load football matches.

        <br><br>

        <small>
          ${esc(error.message)}
        </small>

        <br><br>

        Check your football API routes and Vercel environment variables.

      </div>
    `;

    $("#count").textContent = "0 matches";
  }
}


/* =========================================
   FILTER MATCHES
========================================= */

function filtered() {
  return S.matches.filter(match => {

    const matchesStatus =
      S.status === "all" ||
      match.status === S.status;

    const matchesLeague =
      S.league === "all" ||
      match.competition === S.league;

    const searchText =
      `${match.home} ${match.away} ${match.competition}`
        .toLowerCase();

    const matchesSearch =
      searchText.includes(
        S.search.toLowerCase().trim()
      );

    return (
      matchesStatus &&
      matchesLeague &&
      matchesSearch
    );
  });
}


/* =========================================
   MATCH STATUS DISPLAY
========================================= */

function statusLabel(match) {
  if (match.status === "live") {
    return match.statusText || "LIVE";
  }

  if (match.status === "finished") {
    return "FT";
  }

  return formatTime(match.date);
}


/* =========================================
   RENDER MATCH LIST
========================================= */

function render() {
  const names = [
    ...new Set(
      S.matches.map(match => match.competition)
    )
  ].sort();

  if (
    S.league !== "all" &&
    !names.includes(S.league)
  ) {
    S.league = "all";
  }

  $("#leagues").innerHTML = [
    `
      <button
        class="filter ${
          S.league === "all" ? "active" : ""
        }"
        data-league="all"
      >
        All competitions
      </button>
    `,

    ...names.map(name => `
      <button
        class="filter ${
          S.league === name ? "active" : ""
        }"
        data-league="${esc(name)}"
      >
        ${esc(name)}
      </button>
    `)

  ].join("");

  const list = filtered();

  $("#count").textContent =
    `${list.length} ${
      list.length === 1 ? "match" : "matches"
    }`;

  $("#heading").textContent =
    "Football matches";

  const groups = new Map();

  list.forEach(match => {
    if (!groups.has(match.competition)) {
      groups.set(match.competition, []);
    }

    groups.get(match.competition).push(match);
  });

  const leagueGroups = [...groups];

  if (!list.length) {
    $("#list").innerHTML = `
      <div class="empty">

        No football matches found for this date or filter.

        <br><br>

        Try selecting another date or competition.

      </div>
    `;

    return;
  }

  $("#list").innerHTML = `
    <div class="groups">

      ${leagueGroups.map(
        ([league, matches]) => `

          <section class="league">

            <div class="league-title">

              <span class="star">
                ★
              </span>

              ${esc(league)}

              <span class="n">
                ${matches.length}
              </span>

            </div>

            ${matches.map(match => `

              <article class="match">

                <div class="time ${
                  match.status === "live"
                    ? "live"
                    : ""
                }">

                  ${esc(statusLabel(match))}

                </div>

                <div class="teams">

                  <div class="team">

                    ${logo(
                      match.home,
                      match.homeLogo
                    )}

                    <span class="teamname">
                      ${esc(match.home)}
                    </span>

                  </div>

                  <div class="team">

                    ${logo(
                      match.away,
                      match.awayLogo
                    )}

                    <span class="teamname">
                      ${esc(match.away)}
                    </span>

                  </div>

                  <div class="matchaction">

                    <button
                      class="details"
                      data-id="${esc(match.id)}"
                    >
                      Match centre ↗
                    </button>

                  </div>

                </div>

                <div class="scores">

                  <span>
                    ${esc(match.hs ?? "–")}
                  </span>

                  <span>
                    ${esc(match.as ?? "–")}
                  </span>

                </div>

              </article>

            `).join("")}

          </section>

        `
      ).join("")}

    </div>
  `;

  $("#list")
    .querySelectorAll("[data-id]")
    .forEach(button => {

      button.addEventListener("click", () => {

        const match = S.matches.find(
          item =>
            item.id === button.dataset.id
        );

        if (match) {
          openCentre(match);
        }

      });

    });
}


/* =========================================
   DATE SELECTOR
========================================= */

function drawDates() {
  const now = new Date();

  const dates = Array.from(
    { length: 7 },
    (_, index) => {

      const date = new Date(now);

      date.setDate(
        now.getDate() + index - 2
      );

      return date;
    }
  );

  $("#dates").innerHTML = dates.map(date => `

    <button
      class="date ${
        sameDate(date, S.date)
          ? "active"
          : ""
      }"
      data-date="${dateKey(date)}"
    >

      ${
        sameDate(date, now)
          ? "Today"
          : sameDate(
              date,
              new Date(
                now.getTime() +
                86400000
              )
            )
            ? "Tomorrow"
            : date.toLocaleDateString(
                [],
                {
                  weekday: "short",
                  month: "short",
                  day: "numeric"
                }
              )
      }

    </button>

  `).join("");

  $("#dates")
    .querySelectorAll("[data-date]")
    .forEach(button => {

      button.onclick = () => {

        S.date = new Date(
          button.dataset.date +
          "T12:00:00"
        );

        drawDates();

        load();
      };

    });
}


/* =========================================
   MATCH CENTRE
========================================= */

function openCentre(match) {
  S.selected = match;
  S.tab = "overview";

  $("#modalTitle").textContent =
    match.competition +
    " · Match Centre";

  $("#scoreboard").innerHTML =
    scoreboard(match);

  drawTabs();
  drawPanel();

  $("#backdrop").classList.add("open");

  document.body.style.overflow = "hidden";
}

function scoreboard(match) {
  return `

    <div class="scoreboard">

      <div class="scoreteam">

        ${logo(
          match.home,
          match.homeLogo
        )}

        <div class="scoreteamname">
          ${esc(match.home)}
        </div>

      </div>

      <div>

        <div class="bigscore">

          ${esc(match.hs ?? "–")}
          :
          ${esc(match.as ?? "–")}

        </div>

        <div class="scorestatus">

          ${esc(statusLabel(match))}

        </div>

      </div>

      <div class="scoreteam">

        ${logo(
          match.away,
          match.awayLogo
        )}

        <div class="scoreteamname">
          ${esc(match.away)}
        </div>

      </div>

    </div>

  `;
}

function drawTabs() {
  const tabs = [
    ["overview", "Overview"],
    ["stats", "Stats"],
    ["events", "Events"]
  ];

  $("#tabs").innerHTML = tabs.map(
    ([id, label]) => `

      <button
        class="tab ${
          S.tab === id
            ? "active"
            : ""
        }"
        data-tab="${id}"
      >

        ${label}

      </button>

    `
  ).join("");

  $("#tabs")
    .querySelectorAll("[data-tab]")
    .forEach(button => {

      button.onclick = () => {

        S.tab = button.dataset.tab;

        drawTabs();
        drawPanel();

      };

    });
}

function detailRows(items) {
  return `

    <div>

      ${items.map(([label, value]) => `

        <div class="detailrow">

          <span>
            ${esc(label)}
          </span>

          <strong>
            ${esc(value ?? "Not provided")}
          </strong>

        </div>

      `).join("")}

    </div>

  `;
}

function toArray(value) {
  if (Array.isArray(value)) {
    return value;
  }

  if (
    value &&
    typeof value === "object"
  ) {
    return Object.entries(value).map(
      ([key, item]) => {

        return typeof item === "object"
          ? {
              label: key,
              ...item
            }
          : {
              label: key,
              value: item
            };

      }
    );
  }

  if (typeof value === "string") {
    return value
      .split(/[,;|]/)
      .map(item => item.trim())
      .filter(Boolean);
  }

  return [];
}

function statsRows(value) {
  return toArray(value).map(item => ({

    label: pick(
      item.name,
      item.label,
      item.type,
      item.statName,
      item.key,
      "Statistic"
    ),

    home: pick(
      item.home,
      item.homeValue,
      item.home_score,
      item.valueHome,
      "—"
    ),

    away: pick(
      item.away,
      item.awayValue,
      item.away_score,
      item.valueAway,
      "—"
    )

  }));
}

function panelEmpty(message) {
  return `

    <div class="empty">

      ${esc(message)}

    </div>

  `;
}

function drawPanel() {
  const match = S.selected;

  if (!match) return;

  const raw = match.raw || {};

  const details = pick(
    raw.details,
    raw.detail,
    raw.statistics,
    raw.stats,
    raw.events,
    raw,
    {}
  );

  if (S.tab === "overview") {
    $("#panel").innerHTML = detailRows([

      [
        "Competition",
        match.competition
      ],

      [
        "Date",
        match.date &&
        dateValue(match.date)
          ? dateValue(
              match.date
            ).toLocaleDateString()
          : "Not provided"
      ],

      [
        "Start time",
        formatTime(match.date)
      ],

      [
        "Venue",
        match.venue
      ],

      [
        "Round",
        match.round
      ],

      [
        "Match ID",
        match.id
      ]

    ]);

    return;
  }

  if (S.tab === "stats") {
    const statistics = statsRows(
      pick(
        details.stats,
        details.statistics,
        details.matchStats,
        details.match_statistics,
        raw.stats,
        raw.statistics
      )
    );

    if (!statistics.length) {
      $("#panel").innerHTML = panelEmpty(
        "Match statistics are not included in the current API response."
      );

      return;
    }

    $("#panel").innerHTML = `

      <table class="table">

        <thead>

          <tr>

            <th>
              ${esc(match.home)}
            </th>

            <th>
              Statistic
            </th>

            <th>
              ${esc(match.away)}
            </th>

          </tr>

        </thead>

        <tbody>

          ${statistics.map(stat => `

            <tr>

              <td>
                ${esc(stat.home)}
              </td>

              <td>
                ${esc(stat.label)}
              </td>

              <td>
                ${esc(stat.away)}
              </td>

            </tr>

          `).join("")}

        </tbody>

      </table>

    `;

    return;
  }

  if (S.tab === "events") {
    const events = toArray(
      pick(
        details.events,
        details.incidents,
        raw.events,
        raw.incidents
      )
    );

    if (!events.length) {
      $("#panel").innerHTML = panelEmpty(
        "Match events are not included in the current API response."
      );

      return;
    }

    $("#panel").innerHTML = events.map(
      event => `

        <div class="event">

          <div class="eventtime">

            ${esc(
              pick(
                event.time,
                event.minute,
                event.eventTime,
                "—"
              )
            )}

            ${
              pick(
                event.time,
                event.minute
              )
                ? "'"
                : ""
            }

          </div>

          <div>

            ${esc(
              pick(
                event.description,
                event.eventName,
                event.type,
                event.name,
                "Match event"
              )
            )}

            ${
              pick(
                event.player,
                event.playerName
              )
                ? `
                  ·
                  ${esc(
                    pick(
                      event.player,
                      event.playerName
                    )
                  )}
                `
                : ""
            }

          </div>

        </div>

      `
    ).join("");

  }
}


/* =========================================
   CLOSE MATCH CENTRE
========================================= */

function closeCentre() {
  $("#backdrop").classList.remove("open");

  document.body.style.overflow = "";

  S.selected = null;
}


/* =========================================
   EVENT LISTENERS
========================================= */

document
  .querySelectorAll("[data-status]")
  .forEach(button => {

    button.onclick = () => {

      S.status = button.dataset.status;

      document
        .querySelectorAll("[data-status]")
        .forEach(item => {

          item.classList.toggle(
            "active",
            item === button
          );

        });

      render();

    };

  });

$("#leagues").addEventListener(
  "click",
  event => {

    const button = event.target.closest(
      "[data-league]"
    );

    if (!button) return;

    S.league = button.dataset.league;

    render();

  }
);

$("#search").addEventListener(
  "input",
  event => {

    S.search = event.target.value;

    render();

  }
);

$("#refresh").onclick = load;

$("#close").onclick = closeCentre;

$("#backdrop").onclick = event => {
  if (event.target === $("#backdrop")) {
    closeCentre();
  }
};

document.addEventListener(
  "keydown",
  event => {
    if (event.key === "Escape") {
      closeCentre();
    }
  }
);


/* =========================================
   INITIALIZATION
========================================= */

drawDates();

load();

setInterval(load, 60000);

</script>

</body>
</html>

<html lang="en">
<head>

<style>
:root{--bg:#101116;--card:#191a22;--card2:#22232d;--line:#30313d;--txt:#f5f5f8;--muted:#a1a3b4;--yellow:#f5d547;--lilac:#b8a7ff;--green:#52d69a;--red:#ff858f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:11px;padding:9px 12px}button:disabled{opacity:.5;cursor:not-allowed}
.app{max-width:1080px;margin:auto;padding:18px 15px 35px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.brand-logo{width:48px;height:48px;object-fit:cover;border-radius:12px;display:block}.brandname{font-weight:850}.sub{font-size:10px;letter-spacing:1.3px;color:var(--muted);text-transform:uppercase;margin-top:3px}.live-indicator{font-size:12px;color:var(--green);font-weight:800}.live-indicator:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:7px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin:27px 0 18px}.eyebrow{color:var(--yellow);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;margin-bottom:7px}h1{font-size:clamp(28px,5vw,40px);line-height:1.08;letter-spacing:-1px;margin:0}.hero p{color:var(--muted);font-size:13px;margin:9px 0 0}.hero-badge{padding:10px 13px;border:1px solid var(--line);background:var(--card);color:var(--yellow);border-radius:12px;font-size:12px;font-weight:800;white-space:nowrap}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:9px;margin:20px 0 12px}.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--txt);outline:none}.search:focus{border-color:var(--lilac)}
.strip,.filters{display:flex;gap:7px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:thin}.date,.filter{white-space:nowrap;font-size:12px;font-weight:750;color:var(--muted)}.date.active{border-color:var(--yellow);color:var(--yellow);background:#f5d54712}.filter.active{border-color:var(--lilac);color:var(--lilac);background:#b8a7ff12}
.notice{display:none;margin:10px 0;padding:11px;border:1px solid #8b7530;background:#f5d54712;color:#eadb92;border-radius:11px;font-size:12px;line-height:1.5}
.heading{display:flex;justify-content:space-between;align-items:center;margin:14px 0 10px;font-size:14px;font-weight:850}.count{color:var(--muted);font-size:12px;font-weight:500}.groups{display:flex;flex-direction:column;gap:12px}.league{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}.league-title{display:flex;align-items:center;gap:9px;padding:13px;background:#1d1e26;font-size:12px;font-weight:850}.league-title .star{color:var(--yellow)}.league-title .n{margin-left:auto;color:var(--muted)}
.match{display:grid;grid-template-columns:65px minmax(0,1fr) 48px;gap:9px;align-items:center;padding:13px 11px;border-top:1px solid #2a2b35}.time{text-align:center;color:var(--muted);font-size:11px}.time.live{color:var(--green);font-weight:850}.teams{display:flex;flex-direction:column;gap:8px;min-width:0}.team{display:flex;align-items:center;gap:8px;min-width:0}.logo,.fallback{width:24px;height:24px;flex:0 0 24px;object-fit:contain}.fallback{display:grid;place-items:center;border-radius:50%;background:#2d2e39;color:#ddd;font-size:9px;font-weight:850}.teamname{font-size:12px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.scores{display:flex;flex-direction:column;gap:8px;text-align:right;font-weight:900;font-size:14px}.matchaction{text-align:left;margin-top:8px}.details{padding:6px 8px;font-size:10px;color:var(--lilac);border-color:#454354;background:#24232f}
.empty,.loading,.error{padding:30px 16px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:13px;line-height:1.6}.error{color:#ffb0b6}
.backdrop{display:none;position:fixed;inset:0;z-index:20;background:#050509d9;align-items:flex-end;justify-content:center}.backdrop.open{display:flex}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:#171820;border:1px solid #343542;border-radius:22px 22px 0 0;padding:16px 14px calc(22px + env(safe-area-inset-bottom))}
.modalhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;font-size:14px;font-weight:850}.close{font-size:22px;width:36px;height:36px;padding:0}.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:17px 10px;background:var(--card2);border:1px solid var(--line);border-radius:15px}.scoreteam{text-align:center;display:flex;flex-direction:column;align-items:center;gap:9px;min-width:0}.scoreteam .logo,.scoreteam .fallback{width:44px;height:44px;font-size:13px}.scoreteamname{font-size:12px;font-weight:800;overflow-wrap:anywhere}.bigscore{font-size:26px;font-weight:950}.scorestatus{font-size:11px;color:var(--muted);text-align:center;margin-top:5px}
.tabs{display:flex;gap:7px;overflow:auto;margin:14px 0 12px}.tab{white-space:nowrap;font-size:12px;font-weight:800;color:var(--muted);background:var(--card2)}.tab.active{border-color:var(--yellow);color:var(--yellow);background:#f5d54712}.panel{min-height:100px}.detailrow{display:flex;justify-content:space-between;gap:12px;padding:11px;background:var(--card2);border:1px solid #2d2e38;border-radius:10px;font-size:12px;margin-bottom:7px}.detailrow strong{color:#eee;text-align:right}.muted{color:var(--muted);font-size:12px;line-height:1.6}.table{width:100%;border-collapse:collapse;font-size:12px}.table td,.table th{padding:10px 6px;border-bottom:1px solid #2c2d37;text-align:center}.table td:first-child,.table th:first-child{text-align:left}.table th{color:var(--muted)}.event{display:grid;grid-template-columns:55px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid #2c2d37;font-size:12px}.eventtime{color:var(--yellow);font-weight:850}
@media(min-width:650px){.app{padding-top:25px}.backdrop{align-items:center;padding:20px}.modal{border-radius:22px;margin:20px}.match{grid-template-columns:78px minmax(0,1fr) 60px;padding:16px}}
@media(max-width:480px){.hero{align-items:flex-start;flex-direction:column}.toolbar{grid-template-columns:1fr}.match{grid-template-columns:52px minmax(0,1fr) 38px;gap:6px;padding:12px 8px}.teamname{font-size:11px}.details{padding:5px 6px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><img class="brand-logo" src="/outcomechad-logo.jpeg" alt="OutcomeChad Sports logo"><div><div class="brandname">OutcomeChad Sports</div><div class="sub">Football live scores</div></div></div>
    <div class="live-indicator">LIVE</div>
  </header>
  <section class="hero">
    <div><div class="eyebrow">The game is on</div><h1>Every match.<br>Every moment.</h1><p>Football live scores, fixtures, results and match details.</p></div>
    <div class="hero-badge">⚽ Football</div>
  </section>
  <div class="toolbar"><input class="search" id="search" placeholder="Search teams or competitions…" type="search" autocomplete="off"><button id="refresh">↻ Refresh</button></div>
  <div class="strip" id="dates"></div>
  <div class="filters" id="statuses">
    <button class="filter active" data-status="all">All matches</button><button class="filter" data-status="live">Live</button><button class="filter" data-status="scheduled">Upcoming</button><button class="filter" data-status="finished">Finished</button>
  </div>
  <div class="filters" id="leagues"></div>
  <div class="notice" id="notice"></div>
  <div class="heading"><span id="heading">Football matches</span><span class="count" id="count">—</span></div>
  <main id="list"><div class="loading">Loading football matches…</div></main>
</div>

<div class="backdrop" id="backdrop" role="dialog" aria-modal="true" aria-label="Match centre">
  <section class="modal">
    <div class="modalhead"><span id="modalTitle">Match Centre</span><button class="close" id="close" aria-label="Close">×</button></div>
    <div id="scoreboard"></div><div class="tabs" id="tabs"></div><div class="panel" id="panel"></div>
  </section>
</div>

<script>
"use strict";

const API={footballLive:"/api/football/live",footballFixtures:"/api/football/fixtures",footballStats:"/api/football/stats",footballEvents:"/api/football/events"};
const S={status:"all",date:new Date(),matches:[],league:"all",search:"",selected:null,tab:"overview"};
const $=selector=>document.querySelector(selector);
const detailsCache=new Map();

const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pick=(...values)=>values.find(v=>v!==undefined&&v!==null&&v!=="");

function rows(payload){
  if(Array.isArray(payload))return payload;
  if(!payload||typeof payload!=="object")return [];
  for(const key of ["data","results","matches","matchList","list","items","response"]){
    if(Array.isArray(payload[key]))return payload[key];
    if(payload[key]&&typeof payload[key]==="object"){
      const nested=rows(payload[key]);if(nested.length)return nested;
    }
  }
  return [];
}
function dateKey(value){
  const d=new Date(value);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function sameDate(a,b){return dateKey(a)===dateKey(b)}
function dateValue(value){
  if(!value)return null;
  if(typeof value==="number")return new Date(value<1e12?value*1000:value);
  const s=String(value);
  if(/^\d{10}$/.test(s))return new Date(Number(s)*1000);
  if(/^\d{13}$/.test(s))return new Date(Number(s));
  const d=new Date(s);return Number.isNaN(d.getTime())?null:d;
}
function formatTime(value){
  const d=dateValue(value);
  return d?d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"—";
}
function initials(name){return String(name||"?").trim().split(/\s+/).slice(0,2).map(x=>x[0]||"").join("").toUpperCase()}
function showNotice(message){const el=$("#notice");el.textContent=message;el.style.display="block"}
function hideNotice(){$("#notice").style.display="none"}

function normalize(match,index=0){
  const home=pick(match.home,match.homeTeam,match.home_team,match.teamHome,match.host,{});
  const away=pick(match.away,match.awayTeam,match.away_team,match.teamAway,match.guest,{});
  const homeName=pick(match.homeName,match.home_team_name,match.homeTeamName,match.hostName,home.name,home.teamName,"Home");
  const awayName=pick(match.awayName,match.away_team_name,match.awayTeamName,match.guestName,away.name,away.teamName,"Away");
  const rawStatus=pick(match.status,match.matchStatus,match.match_status,match.state,match.statusName,match.status_name,"");
  const statusText=String(rawStatus).toLowerCase();
  let status="scheduled";
  if(rawStatus==="finished"||/finish|ended|full.?time|\bft\b|after.?extra.?time|after.?penalties/.test(statusText))status="finished";
  else if(rawStatus==="live"||/live|in.?play|playing|half.?time|1st half|2nd half|extra.?time|penalt/.test(statusText))status="live";
  else if(/cancel|postpon|abandon|suspend/.test(statusText))status="other";
  const competition=pick(match.competitionName,match.leagueName,match.league_name,match.competition,match.league,match.tournamentName,"Football");
  return {
    id:String(pick(match.matchId,match.match_id,match.id,match.fixtureId,match.fixture_id,index)),
    raw:match,
    home:String(typeof homeName==="object"?pick(homeName.name,homeName.teamName,"Home"):homeName),
    away:String(typeof awayName==="object"?pick(awayName.name,awayName.teamName,"Away"):awayName),
    homeId:pick(match.homeTeamId,match.home_team_id,match.homeId,home.id,home.teamId),
    awayId:pick(match.awayTeamId,match.away_team_id,match.awayId,away.id,away.teamId),
    homeLogo:pick(match.homeLogo,match.home_logo,match.homeTeamLogo,home.logo,home.logoUrl,home.image_path),
    awayLogo:pick(match.awayLogo,match.away_logo,match.awayTeamLogo,away.logo,away.logoUrl,away.image_path),
    hs:pick(match.homeScore,match.home_score,match.homeGoals,match.scoreHome),
    as:pick(match.awayScore,match.away_score,match.awayGoals,match.scoreAway),
    status,
    statusText:status==="live"?"LIVE":status==="finished"?"FT":String(rawStatus||""),
    date:pick(match.matchTime,match.match_time,match.startTime,match.start_time,match.date,match.kickoff,match.time,match.timestamp),
    competition:String(typeof competition==="object"?pick(competition.name,competition.title,"Football"):competition),
    venue:typeof match.venue==="object"?pick(match.venue.name,match.venue.venue_name):pick(match.venue,match.stadium),
    round:pick(match.round,match.stage,match.matchRound)
  };
}
function logo(name,url){
  if(url)return `<img class="logo" src="${esc(url)}" alt="" loading="lazy" onerror="this.outerHTML='<span class=&quot;fallback&quot;>${esc(initials(name))}</span>'">`;
  return `<span class="fallback">${esc(initials(name))}</span>`;
}

async function load(){
  if(!S.matches.length)$("#list").innerHTML='<div class="loading">Loading football matches…</div>';
  hideNotice();
  try{
    const fixtureUrl=new URL(API.footballFixtures,location.origin);
    fixtureUrl.searchParams.set("date",dateKey(S.date));
    const response=await fetch(fixtureUrl,{cache:"no-store"});
    if(!response.ok)throw new Error(`Fixtures API returned ${response.status}`);
    const payload=await response.json();
    let matches=rows(payload).map(normalize).filter(m=>m.home&&m.away);

    if(sameDate(S.date,new Date())){
      try{
        const liveResponse=await fetch(API.footballLive,{cache:"no-store"});
        if(liveResponse.ok){
          const livePayload=await liveResponse.json();
          const liveMatches=rows(livePayload).map(normalize).filter(m=>m.home&&m.away);
          const liveMap=new Map(liveMatches.map(m=>[String(m.id),m]));
          matches=matches.map(fixture=>{
            const live=liveMap.get(String(fixture.id));if(!live)return fixture;
            return {...fixture,hs:live.hs??fixture.hs,as:live.as??fixture.as,status:live.status==="live"?"live":live.status==="finished"?"finished":fixture.status,statusText:live.statusText||fixture.statusText,raw:{...fixture.raw,...live.raw}};
          });
          const known=new Set(matches.map(m=>String(m.id)));
          for(const live of liveMatches)if(!known.has(String(live.id)))matches.push(live);
        }
      }catch(error){console.warn("Live score refresh failed:",error)}
    }
    S.matches=matches;
    if((payload.message||payload.error)&&!matches.length)showNotice(payload.message||payload.error);
    render();
  }catch(error){
    console.error("Match list load failed:",error);S.matches=[];
    $("#list").innerHTML=`<div class="error">Could not load football matches.<br><br><small>${esc(error.message)}</small><br><br>Check your fixtures API route and Vercel environment variables.</div>`;
    $("#count").textContent="0 matches";
  }
}
function filtered(){
  return S.matches.filter(m=>(S.status==="all"||m.status===S.status)&&(S.league==="all"||m.competition===S.league)&&`${m.home} ${m.away} ${m.competition}`.toLowerCase().includes(S.search.toLowerCase().trim()));
}
function statusLabel(match){
  if(match.status==="live")return match.statusText||"LIVE";
  if(match.status==="finished")return "FT";
  return formatTime(match.date);
}
function render(){
  const names=[...new Set(S.matches.map(m=>m.competition))].sort();
  if(S.league!=="all"&&!names.includes(S.league))S.league="all";
  $("#leagues").innerHTML=`<button class="filter ${S.league==="all"?"active":""}" data-league="all">All competitions</button>`+names.map(name=>`<button class="filter ${S.league===name?"active":""}" data-league="${esc(name)}">${esc(name)}</button>`).join("");
  const list=filtered();$("#count").textContent=`${list.length} ${list.length===1?"match":"matches"}`;$("#heading").textContent="Football matches";
  const groups=new Map();list.forEach(m=>{if(!groups.has(m.competition))groups.set(m.competition,[]);groups.get(m.competition).push(m)});
  if(!list.length){$("#list").innerHTML='<div class="empty">No football matches found for this date or filter.<br><br>Try another date or competition.</div>';return}
  $("#list").innerHTML=`<div class="groups">${[...groups].map(([league,matches])=>`<section class="league"><div class="league-title"><span class="star">★</span>${esc(league)}<span class="n">${matches.length}</span></div>${matches.map(m=>`<article class="match"><div class="time ${m.status==="live"?"live":""}">${esc(statusLabel(m))}</div><div class="teams"><div class="team">${logo(m.home,m.homeLogo)}<span class="teamname">${esc(m.home)}</span></div><div class="team">${logo(m.away,m.awayLogo)}<span class="teamname">${esc(m.away)}</span></div><div class="matchaction"><button class="details" data-id="${esc(m.id)}">Match centre ↗</button></div></div><div class="scores"><span>${esc(m.hs??"–")}</span><span>${esc(m.as??"–")}</span></div></article>`).join("")}</section>`).join("")}</div>`;
  $("#list").querySelectorAll("[data-id]").forEach(button=>button.addEventListener("click",()=>{const match=S.matches.find(m=>m.id===button.dataset.id);if(match)openCentre(match)}));
}

function drawDates(){
  const now=new Date();
  const dates=Array.from({length:7},(_,i)=>{const d=new Date(now);d.setDate(now.getDate()+i-2);return d});
  $("#dates").innerHTML=dates.map(d=>`<button class="date ${sameDate(d,S.date)?"active":""}" data-date="${dateKey(d)}">${sameDate(d,now)?"Today":sameDate(d,new Date(now.getTime()+86400000))?"Tomorrow":d.toLocaleDateString([],{weekday:"short",month:"short",day:"numeric"})}</button>`).join("");
  $("#dates").querySelectorAll("[data-date]").forEach(button=>button.onclick=()=>{S.date=new Date(button.dataset.date+"T12:00:00");drawDates();load()});
}

/* MATCH CENTRE */
function openCentre(match){
  S.selected=match;S.tab="overview";
  $("#modalTitle").textContent=`${match.competition} · Match Centre`;
  $("#scoreboard").innerHTML=scoreboard(match);
  drawTabs();drawPanel();
  $("#backdrop").classList.add("open");document.body.style.overflow="hidden";
}
function scoreboard(match){
  return `<div class="scoreboard"><div class="scoreteam">${logo(match.home,match.homeLogo)}<div class="scoreteamname">${esc(match.home)}</div></div><div><div class="bigscore">${esc(match.hs??"–")} : ${esc(match.as??"–")}</div><div class="scorestatus">${esc(statusLabel(match))}</div></div><div class="scoreteam">${logo(match.away,match.awayLogo)}<div class="scoreteamname">${esc(match.away)}</div></div></div>`;
}
function drawTabs(){
  const tabs=[["overview","Overview"],["stats","Stats"],["events","Events"]];
  $("#tabs").innerHTML=tabs.map(([id,label])=>`<button class="tab ${S.tab===id?"active":""}" data-tab="${id}">${label}</button>`).join("");
  $("#tabs").querySelectorAll("[data-tab]").forEach(button=>button.onclick=()=>{S.tab=button.dataset.tab;drawTabs();drawPanel()});
}
function panelEmpty(message){return `<div class="empty">${esc(message)}</div>`}
function panelLoading(message){return `<div class="loading">${esc(message)}</div>`}
function getType(item){return pick(item?.type?.name,item?.type?.developer_name,item?.type?.code,item?.type_name,item?.name,item?.label,item?.description,"Detail")}
function getValue(item){return pick(item?.value,item?.data?.value,item?.data,item?.result,item?.total,item?.amount,item?.percentage,"—")}
function participantId(item){return String(pick(item?.participant_id,item?.team_id,item?.participant?.id,item?.team?.id,""))}
function eventMinute(event){
  const min=pick(event?.minute,event?.time?.minute,event?.fixture_minute,event?.elapsed);
  const extra=pick(event?.extra_minute,event?.time?.extra,event?.added_time);
  if(min===undefined||min===null)return "—";
  return `${min}${extra?`+${extra}`:""}'`;
}
function eventText(event){
  const type=getType(event);
  const player=pick(event?.player_name,event?.player?.name,event?.player?.display_name,event?.related_player_name,event?.related_player?.name);
  const detail=pick(event?.addition,event?.info,event?.result);
  const side=pick(event?.participant?.name,event?.team?.name);
  return [type,player,detail,side].filter(Boolean).join(" · ");
}
async function loadMatchDetails(match,kind){
  const id=String(match.id||"");
  if(!id||id==="undefined")throw new Error("The selected match has no valid fixture ID.");
  const key=`${id}:${kind}`;
  if(detailsCache.has(key))return detailsCache.get(key);
  const endpoint=kind==="stats"?API.footballStats:API.footballEvents;
  const response=await fetch(`${endpoint}?matchId=${encodeURIComponent(id)}`,{cache:"no-store"});
  let payload={};try{payload=await response.json()}catch{}
  if(!response.ok)throw new Error(payload.error||payload.message||`Request failed (${response.status})`);
  const data=kind==="stats"?payload.statistics:payload.events;
  const list=Array.isArray(data)?data:[];
  detailsCache.set(key,list);
  return list;
}
function renderStats(match,items){
  const homeId=String(match.homeId??"");
  const awayId=String(match.awayId??"");
  const grouped=new Map();
  for(const item of items){
    const label=getType(item);
    const sideId=participantId(item);
    const value=getValue(item);
    if(!grouped.has(label))grouped.set(label,{label,home:"—",away:"—"});
    const row=grouped.get(label);
    if(sideId&&homeId&&sideId===homeId)row.home=value;
    else if(sideId&&awayId&&sideId===awayId)row.away=value;
    else if(item?.location==="home"||item?.side==="home")row.home=value;
    else if(item?.location==="away"||item?.side==="away")row.away=value;
  }
  return [...grouped.values()];
}
async function drawPanel(){
  const match=S.selected;if(!match)return;
  const panel=$("#panel"),tab=S.tab;
  if(tab==="overview"){
    panel.innerHTML=`<div class="detailrow"><span>Competition</span><strong>${esc(match.competition)}</strong></div><div class="detailrow"><span>Date</span><strong>${esc(match.date&&dateValue(match.date)?dateValue(match.date).toLocaleDateString():"Not provided")}</strong></div><div class="detailrow"><span>Kickoff</span><strong>${esc(formatTime(match.date))}</strong></div><div class="detailrow"><span>Venue</span><strong>${esc(match.venue??"Not provided")}</strong></div><div class="detailrow"><span>Round</span><strong>${esc(match.round??"Not provided")}</strong></div><div class="detailrow"><span>Fixture ID</span><strong>${esc(match.id)}</strong></div>`;
    return;
  }
  panel.innerHTML=panelLoading(tab==="stats"?"Loading match statistics…":"Loading match events…");
  try{
    const data=await loadMatchDetails(match,tab);
    if(S.selected?.id!==match.id||S.tab!==tab)return;
    if(tab==="stats"){
      const stats=renderStats(match,data);
      if(!stats.length){panel.innerHTML=panelEmpty("No statistics are available for this match yet. Statistics can depend on the competition and match coverage.");return}
      panel.innerHTML=`<table class="table"><thead><tr><th>${esc(match.home)}</th><th>Statistic</th><th>${esc(match.away)}</th></tr></thead><tbody>${stats.map(s=>`<tr><td>${esc(s.home)}</td><td>${esc(s.label)}</td><td>${esc(s.away)}</td></tr>`).join("")}</tbody></table>`;
      return;
    }
    if(tab==="events"){
      if(!data.length){panel.innerHTML=panelEmpty("No events are available for this match yet.");return}
      const sorted=[...data].sort((a,b)=>Number(pick(a.minute,a.time?.minute,a.fixture_minute,0))-Number(pick(b.minute,b.time?.minute,b.fixture_minute,0)));
      panel.innerHTML=sorted.map(event=>`<div class="event"><div class="eventtime">${esc(eventMinute(event))}</div><div>${esc(eventText(event))}</div></div>`).join("");
    }
  }catch(error){
    console.error(`Match Centre ${tab} request failed:`,error);
    if(S.selected?.id!==match.id||S.tab!==tab)return;
    panel.innerHTML=panelEmpty(error.message||"Could not load details. Please retry.");
  }
}
function closeCentre(){ $("#backdrop").classList.remove("open");document.body.style.overflow="";S.selected=null; }
document.querySelectorAll("[data-status]").forEach(button=>button.onclick=()=>{S.status=button.dataset.status;document.querySelectorAll("[data-status]").forEach(item=>item.classList.toggle("active",item===button));render()});
$("#leagues").addEventListener("click",event=>{const button=event.target.closest("[data-league]");if(!button)return;S.league=button.dataset.league;render()});
$("#search").addEventListener("input",event=>{S.search=event.target.value;render()});
$("#refresh").onclick=load;$("#close").onclick=closeCentre;
$("#backdrop").onclick=event=>{if(event.target===$("#backdrop"))closeCentre()};
document.addEventListener("keydown",event=>{if(event.key==="Escape")closeCentre()});
drawDates();load();setInterval(load,60000);
</script>
</body>
</html>

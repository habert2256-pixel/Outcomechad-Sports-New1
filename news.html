<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101116"><meta name="description" content="Latest football headlines, match reports and updates from OutcomeChad Sports."><title>Football News | OutcomeChad Sports</title><link rel="canonical" href="https://outcomechadsports.com/news.html"><link rel="icon" href="/favicon.png?v=6"><style>
:root{--bg:#101116;--card:#202020;--card2:#252630;--line:#30313d;--txt:#f5f5f8;--muted:#a1a3b4;--yellow:#f5d547}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Arial,Helvetica,sans-serif}a{color:inherit}
.app{max-width:1080px;margin:auto;padding:20px 15px 40px}header,.brand,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{justify-content:flex-start;text-decoration:none}.brand img{width:48px;height:48px;object-fit:contain}.brandname{font-weight:900;font-size:17px}.sub{font-size:10px;letter-spacing:1.3px;color:var(--muted);text-transform:uppercase}.live{color:var(--yellow);font-size:12px;font-weight:900}
nav{display:flex;gap:9px;overflow-x:auto;margin:22px 0;padding:5px 0 13px}nav a{white-space:nowrap;text-decoration:none;font-weight:800;color:var(--muted);padding:10px 13px;border:1px solid var(--line);border-radius:11px}nav a.active{color:var(--yellow);border-color:var(--yellow);background:#f5d54712}
.eyebrow{color:var(--yellow);font-size:11px;letter-spacing:2px;font-weight:900}h1{font-size:clamp(28px,5vw,40px);line-height:1.1;margin:9px 0}.intro,.muted{color:var(--muted);font-size:13px;line-height:1.6}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.toolbar input{flex:1;min-width:180px;padding:13px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--txt)}
button{cursor:pointer;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:11px;padding:10px 13px}
.loading,.empty,.error{padding:28px 15px;text-align:center;border:1px solid var(--line);border-radius:13px;background:var(--card);color:var(--muted);font-size:13px;line-height:1.7}.error{color:#ffadb5}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;margin:12px 0}.site-footer{text-align:center;border-top:1px solid var(--line);margin-top:35px;padding:22px;color:var(--muted);font-size:12px}
.news-feature,.news-item{display:grid;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:15px;margin:12px 0;text-decoration:none}.news-feature{grid-template-columns:40% 1fr}.news-item{grid-template-columns:28% 1fr;min-height:125px}
.news-feature img,.news-item img{width:100%;height:100%;min-height:130px;object-fit:cover;background:var(--card2)}.news-copy{padding:14px}.news-copy h2,.news-copy h3{font-family:Georgia,serif;line-height:1.3;margin:0 0 9px}.news-copy h2{font-size:21px}.news-copy h3{font-size:16px}.meta{font-size:11px;color:var(--muted);margin-top:9px}
.fixture{display:grid;grid-template-columns:75px 1fr auto;gap:10px;align-items:center;padding:13px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0}.fixture-time{text-align:center;color:var(--yellow);font-weight:900;font-size:12px}.teams{display:grid;gap:8px;min-width:0}.team{font-size:13px;font-weight:800}.transfer-player{display:flex;align-items:center;gap:13px;margin:12px 0 16px}.player-photo,.player-fallback{width:68px;height:68px;border-radius:50%;object-fit:cover;background:var(--card2)}.player-fallback{display:grid;place-items:center;color:var(--yellow);font-weight:900}.route{display:grid;grid-template-columns:1fr 30px 1fr;gap:8px;align-items:center;background:var(--card2);border-radius:12px;padding:12px}.club{font-size:13px;font-weight:800;overflow-wrap:anywhere}.club small{display:block;color:var(--muted);font-weight:400;margin-bottom:4px}.arrow{text-align:center;color:var(--yellow);font-size:25px}
@media(max-width:560px){.news-feature{grid-template-columns:1fr}.news-feature img{height:210px}.news-item{grid-template-columns:30% 1fr}.news-copy{padding:10px}.news-copy h3{font-size:14px}.fixture{grid-template-columns:62px 1fr auto}.route{grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr)}}
</style></head><body><div class="app"><header><a class="brand" href="/"><img src="/favicon.png?v=6" alt="OutcomeChad Sports"><span><span class="brandname">OutcomeChad Sports</span><br><span class="sub">Live Scores · Football Coverage</span></span></a><span class="live">● LIVE</span></header><nav aria-label="Main navigation"><a href="/" class="">Home</a><a href="/news.html" class="active">News</a><a href="/lineups.html" class="">Lineups</a><a href="/transfers.html" class="">Transfers</a></nav><section><div class="eyebrow">THE LATEST FROM THE GAME</div><h1>Football News</h1><p class="intro">The latest football headlines, reports and updates from across the game.</p><div class="toolbar"><input id="search" type="search" placeholder="Search football news…"><button id="refresh">↻ Refresh</button></div><div id="newsList"><div class="loading">Loading football news…</div></div></section><footer class="site-footer">© 2026 OutcomeChad Sports Services. All rights reserved.</footer></div><script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rows=p=>Array.isArray(p)?p:(Array.isArray(p?.data)?p.data:[]);
const safe=v=>{try{let u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:''}catch{return''}};
let articles=[];
function render(){let q=$('#search').value.trim().toLowerCase(),a=articles.filter(x=>(x.title+' '+x.description+' '+x.source).toLowerCase().includes(q));if(!a.length){$('#newsList').innerHTML='<div class="empty">No matching football articles found.</div>';return}
$('#newsList').innerHTML=a.map((x,i)=>{let u=safe(x.url),im=safe(x.image),cls=i?'news-item':'news-feature';return `<a class="${cls}" href="${u||'#'}" ${u?'target="_blank" rel="noopener noreferrer"':''}>${im?`<img src="${esc(im)}" alt="" loading="lazy">`:'<div class="loading">⚽</div>'}<div class="news-copy"><h${i?3:2}>${esc(x.title||'Football News')}</h${i?3:2}><p class="muted">${esc(x.description||'')}</p><div class="meta">${esc(x.source||'Football News')} · ${esc(x.publishedAt||'Date unavailable')}</div></div></a>`}).join('')}
async function load(){ $('#newsList').innerHTML='<div class="loading">Loading football news…</div>';try{let r=await fetch('/api/football/news',{cache:'no-store'}),p=await r.json();if(!r.ok||p.success===false)throw Error(p.message||p.error||`HTTP ${r.status}`);articles=rows(p);render()}catch(e){$('#newsList').innerHTML=`<div class="error">Could not load news: ${esc(e.message)}</div>`}}
$('#search').addEventListener('input',render);$('#refresh').onclick=load;load();
</script></body></html>
